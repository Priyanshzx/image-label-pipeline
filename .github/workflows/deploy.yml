# Save as: .github/workflows/deploy.yml in your repo
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

# Needed for OIDC (no long-lived AWS keys stored in GitHub)
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1                 # must match region in samconfig.toml
  STACK_NAME: image-labeling-pipeline    # must match stack_name in samconfig.toml

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install boto3 pytest cfn-lint

      - name: Lint CloudFormation template
        run: cfn-lint template.yaml

      - name: Run unit tests
        run: pytest -v

  deploy:
    name: Build and deploy
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SAM build
        run: sam build

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name "$STACK_NAME" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
